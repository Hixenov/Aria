# Builds Aria for macOS and Linux when a release is published, tests each build, and attaches the
# files to the release. The Windows installer and aria.exe are built on Windows with Inno Setup
# and attached when the release is made; this workflow then writes SHA256SUMS.txt for all files.
#
# Run it by hand (Actions, Release, Run workflow) to build a tag again, or to build without
# uploading anything: the files are then kept as the run's artifacts.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, for example v0.2.8"
        required: true
      upload:
        description: "Attach the files to that release (off: keep them as artifacts only)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  UPLOAD: ${{ github.event_name == 'release' || inputs.upload }}

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Keep `toolchain` in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Test
        run: cargo test --release --workspace --locked
      - name: Build
        run: cargo build --release --locked -p aria-app
      - name: Bundle Aria.app
        run: |
          set -euo pipefail
          version="${TAG#v}"
          app="dist/Aria.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/aria "$app/Contents/MacOS/aria"
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset="dist/aria.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" assets/icon/aria-256.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
          done
          for size in 16 32 128; do
            double=$((size * 2))
            sips -z "$double" "$double" assets/icon/aria-256.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/aria.icns"
          # Apple silicon runs only signed code: an ad-hoc signature, not a developer's.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/aria"
          (cd dist && ditto -c -k --keepParent Aria.app "Aria-$version-macos-arm64.zip")
          echo "ASSET=dist/Aria-$version-macos-arm64.zip" >> "$GITHUB_ENV"
      - name: Attach to the release
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.ASSET }}

  linux:
    name: Linux (x86_64)
    # The oldest supported Ubuntu, so that the build runs on systems with an older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Keep `toolchain` in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Install Linux dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libasound2-dev libdbus-1-dev pkg-config
      - name: Test
        run: cargo test --release --workspace --locked
      - name: Build
        run: cargo build --release --locked -p aria-app
      - name: Package
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="Aria-$version-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/aria "dist/$name/aria"
          strip "dist/$name/aria"
          cp packaging/linux/aria.desktop "dist/$name/aria.desktop"
          cp assets/icon/aria-256.png "dist/$name/aria.png"
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "dist/$name/"
          file "dist/$name/aria"
          ldd "dist/$name/aria"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
      - name: Attach to the release
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ env.ASSET }}

  checksums:
    name: SHA256SUMS.txt
    needs: [macos, linux]
    if: (github.event_name == 'release' || inputs.upload)
    runs-on: ubuntu-latest
    steps:
      - name: Checksums of every file of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files --pattern '*' --skip-existing
          rm -f files/SHA256SUMS.txt
          (cd files && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
