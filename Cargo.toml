[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hixenov/Aria"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "persistence", "accesskit", "clipboard", "links", "default_fonts", "wayland", "x11"] }
aria-core = { path = "crates/aria-core" }
egui = "0.37"
egui_kittest = "0.37"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
crossbeam-channel = "0.5.17"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
directories = "6"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2.5"
thiserror = "2"
anyhow = "1"
tempfile = "3.27"
ttf-parser = "0.25.1"
open = "5.4.5"
rfd = { version = "0.17.2", default-features = false }
aria-audio = { path = "crates/aria-audio" }
aria-library = { path = "crates/aria-library" }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav", "opt-simd"] }
symphonia-adapter-libopus = "0.3.0"
cpal = "0.18.2"
rubato = "5.0.1"
rtrb = "0.4.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
lofty = "0.25.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10"
egui_extras = "0.37"
pollster = "0.4"
