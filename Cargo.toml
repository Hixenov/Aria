[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "persistence", "accesskit", "clipboard", "links", "default_fonts", "wayland", "x11"] }
egui = "0.37"
egui_kittest = "0.37"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
crossbeam-channel = "0.5.17"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
directories = "6"
fluent-bundle = "0.16"
unic-langid = "0.9.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2.5"
thiserror = "2"
anyhow = "1"
tempfile = "3.27"
