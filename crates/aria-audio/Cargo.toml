[package]
name = "aria-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Helpers that write small WAV fixtures for tests. Off by default.
test-support = []

[dependencies]
symphonia = { workspace = true }
symphonia-adapter-libopus = { workspace = true }
rubato = { workspace = true }
cpal = { workspace = true }
rtrb = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# The exclusive-mode WASAPI output.
[target.'cfg(windows)'.dependencies]
wasapi = { workspace = true }

[dev-dependencies]
aria-audio = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
